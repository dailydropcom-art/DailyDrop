<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Seller Login | DailyDrop</title>
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<main>
		<section class="login-section">
			<div class="login-card">
				<a class="logo" href="../Customer Web/index.html">Daily<span>Drop</span></a>
				<p class="eyebrow">Seller Hub</p>
				<h1>Seller Login</h1>
				<p class="login-intro">Sign in to manage your DailyDrop store.</p>
				<form class="login-form" data-role="seller" data-login-target="dashboard.html">
					<label for="seller-email">Email ID</label>
					<input id="seller-email" name="email" type="email" autocomplete="email" placeholder="you@business.com" required>
					<label for="seller-password">Password</label>
					<input id="seller-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6">
					<button class="button button-primary" type="submit">Log in to Seller Hub <span aria-hidden="true">→</span></button>
				</form>
				<p><a class="login-back" href="register.html">New seller? Register your store</a></p>
				<a class="login-back" href="../Customer Web/index.html">Return to shop</a>
			</div>
		</section>
	</main>
	<script src="../js/app.js"></script>
</body>
</html>
