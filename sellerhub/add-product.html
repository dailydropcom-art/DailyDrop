<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Product | DayliDrope</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main><section><div class="container"><p class="section-label">Seller Hub</p><h1>Add Product</h1><form id="productForm"><p><label>Product image<br><input id="productImage" type="file" name="image" accept="image/*" required></label></p><img id="imagePreview" class="product-preview" alt="Selected product preview" hidden><p><label>Product name<br><input type="text" name="name" required></label></p><p><label>Price<br><input type="number" name="price" min="0" step="0.01" required></label></p><p><label>Pack size<br><input type="text" name="unit" placeholder="e.g. 5kg crate" required></label></p><p><label>Category<br><select name="category"><option value="groceries">Groceries</option><option value="snacks">Snacks</option><option value="beverages">Beverages</option><option value="chocolate">Chocolate</option><option value="school-notebooks">School Notebooks</option><option value="personal-care">Personal care</option></select></label></p><p><label>Stock<br><input type="number" name="stock" min="0" required></label></p><button class="btn" type="submit">Submit for approval</button></form><p><a href="products.html">Back to products</a></p></div></section></main><script src="../js/app.js"></script></body></html>
