<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration | DailyDrop</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main><section class="login-section"><div class="login-card">
        <a class="logo" href="../Customer Web/index.html">Daily<span>Drop</span></a>
        <p class="eyebrow">Seller Hub</p><h1>Register your store</h1>
        <p class="login-intro">Create a seller account to list products on DailyDrop.</p>
        <form id="sellerRegistration" class="login-form">
            <label for="store-name">Store name</label><input id="store-name" name="store" required>
            <label for="seller-name">Contact name</label><input id="seller-name" name="name" required>
            <label for="seller-email">Email ID</label><input id="seller-email" name="email" type="email" required>
            <label for="seller-phone">Phone number</label><input id="seller-phone" name="phone" type="tel" required>
            <label for="seller-password">Password</label><input id="seller-password" name="password" type="password" minlength="6" required>
            <button class="button button-primary" type="submit">Register Seller <span aria-hidden="true">→</span></button>
        </form>
        <p><a class="login-back" href="login.html">Already registered? Log in</a></p>
    </div></section></main>
    <script src="../js/app.js"></script>
</body>
</html>
