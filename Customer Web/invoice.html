<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | DailyDrop</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .invoice-shell { max-width: 820px; margin: 0 auto; }
        .invoice-header, .invoice-meta, .invoice-total { display: flex; justify-content: space-between; gap: 24px; }
        .invoice-header .eyebrow { font-size: 35px; }
        .invoice-header { align-items: start; margin-bottom: 36px; }
        .invoice-meta { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 20px 0; margin-bottom: 28px; }
        .invoice-meta p, .invoice-header p { margin: 10px 0; }
        .invoice-table { width: 100%; border-collapse: collapse; }
        .invoice-table th, .invoice-table td { padding: 13px 0; border-bottom: 1px solid var(--line); text-align: left; }
        .invoice-table th:not(:first-child), .invoice-table td:not(:first-child) { text-align: right; }
        .invoice-total { justify-content: flex-end; gap: 48px; padding: 20px 0; font-size: 1.15rem; }
        .invoice-actions { display: flex; gap: 12px; margin-top: 26px; }
        @media print { .header, .footer, .invoice-actions { display: none; } .section { padding: 0; } .invoice-shell { max-width: none; } }
        @media (max-width: 560px) { .invoice-header, .invoice-meta { display: block; } .invoice-header > div + div, .invoice-meta > div + div { margin-top: 18px; } .invoice-table { font-size: .85rem; } }
    </style>
</head>
<body>
    <header class="header"><div class="container header-inner"><a class="logo" href="index.html">Daily<span>Drop</span></a><nav class="nav"><a href="index.html">Home</a><a href="orders.html">My Orders</a><a href="profile.html">Customer Profile</a><a class="cart-link" href="cart.html">Cart <span id="cartCount">0</span></a></nav></div></header>
    <main><section class="section"><div class="container invoice-shell" id="invoiceDocument"><p>Loading invoice...</p></div></section></main>
    <footer class="footer"><div class="container"><a class="logo" href="index.html">Daily<span>Drop</span></a><p>© <span id="currentYear"></span> DailyDrop. All rights reserved.</p></div></footer>
    <script src="js/invoice.js"></script>
</body>
</html>
