<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seller Profile | DayliDrope</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="header"><div class="container header-inner"><a class="logo" href="../Customer Web/index.html">Daily<span>Drop</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="profile.html">Profile</a></nav></div></header><main><section><div class="container"><p class="section-label">Seller Hub</p><h1>Store Profile</h1><p>Set your store name, contact details, and delivery preferences.</p><div id="sellerProfileStatus" class="card"></div><form id="sellerProfileForm" class="checkout-form"><label>Store name<input name="store" required></label><label>Contact name<input name="name" required></label><label>Email address<input name="email" type="email" required></label><label>Phone number<input name="phone" type="tel" required></label><label>Delivery preferences<textarea name="deliveryPreferences" placeholder="Delivery days, timings, or instructions"></textarea></label><button class="btn" type="submit">Save profile</button><p id="sellerProfileMessage" role="status"></p></form><form id="sellerPasswordForm" class="checkout-form"><h2>Change password</h2><label>Current password<input name="currentPassword" type="password" minlength="6" required></label><label>New password<input name="newPassword" type="password" minlength="6" required></label><label>Confirm new password<input name="confirmPassword" type="password" minlength="6" required></label><button class="btn" type="submit">Change password</button><p id="sellerPasswordMessage" role="status"></p></form><a class="btn" href="dashboard.html">Back to dashboard</a></div></section></main><script src="../js/app.js"></script></body></html>
