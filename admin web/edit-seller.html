<body>
    <main><section><div class="container"><p class="section-label">Administration</p><h1>Edit seller</h1><form id="editSellerForm" class="checkout-form"><label>Store name<input name="store" required></label><label>Contact name<input name="name" required></label><label>Email address<input name="email" type="email" required></label><label>Phone number<input name="phone" type="tel" required></label><label>Approval status<select name="status"><option>Pending approval</option><option>Approved</option><option>Suspended</option></select></label><button class="btn" type="submit">Save seller</button></form><p><a href="sellers.html">Back to sellers</a></p></div></section></main>
