<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard | DailyDrop</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="header"><div class="container header-inner"><a class="logo" href="../Customer Web/index.html">Daily<span>Drop</span></a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="orders.html">Orders</a><a href="sellers.html">Sellers</a><a href="customers.html">Customers</a><a href="products.html">Products</a><a href="settings.html">Settings</a></nav></div></header><main><section><div class="container"><p class="section-label">Administration</p><h1>Dashboard</h1><div id="adminStats" class="products-grid"></div><div class="admin-editor"><h2>Edit seller dashboard banner</h2><form id="bannerForm" class="checkout-form"><label>Seller dashboard banner image<input id="bannerImage" name="image" type="file" accept="image/*"></label><img id="bannerImagePreview" class="product-preview" alt="Seller dashboard banner preview" hidden><button class="btn" type="submit">Save seller banner</button></form></div><div class="admin-editor"><h2>Edit customer web dashboard banner</h2><form id="customerBannerForm" class="checkout-form"><label>Customer web dashboard banner image<input id="customerBannerImage" name="image" type="file" accept="image/*"></label><img id="customerBannerImagePreview" class="product-preview" alt="Customer web dashboard banner preview" hidden><button class="btn" type="submit">Save customer banner</button></form></div><div class="admin-editor"><h2>Edit categories</h2><form id="categoryForm" class="checkout-form"><label>Category image<input id="categoryImage" name="image" type="file" accept="image/*" required></label><img id="categoryImagePreview" class="product-preview" alt="Category preview" hidden><label>Category name<input name="name" required></label><label>Category description<textarea name="description" required></textarea></label><label>Category link<input name="slug" placeholder="groceries" required></label><button class="btn" type="submit">Add category</button></form><div id="adminCategories" class="admin-category-list"></div></div><div class="admin-dashboard-section"><div class="section-heading"><h2>Seller sales after purchase</h2></div><div id="adminSales" class="products-grid"></div></div><div class="admin-dashboard-section"><div class="section-heading"><h2>Product image review</h2><a href="products.html">View all products</a></div><div id="adminProducts" class="products-grid"></div></div><div class="admin-dashboard-section"><div class="section-heading"><h2>Recent orders</h2><a href="orders.html">Manage orders</a></div><div id="adminOrders" class="admin-orders"></div></div></div></section></main><script src="../js/app.js"></script></body></html>
